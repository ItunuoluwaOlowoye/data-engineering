# Databricks Asset Bundle (DAB) config

bundle:
  name: dq-demo

include:
  - resources/pipeline.yml
  - resources/schemas.yml
  - resources/alerts.yml

sync:
  include:
    - databricks.yml
    - resources/**
    - src/**

variables:
  catalog:
    description: "Unity Catalog name"
    default: "workspace"

  volume_files:
    description: "Path to files used for data ingestion"
    default: "/Volumes/workspace/demo/files"

  dab_target_name:
    description: "Name of the target environment to use for DAB operations"
    default: "dev"

  warehouse_id:
    description: "SQL warehouse used to run the expectation-violation alert"
    lookup:
      warehouse: "Serverless Starter Warehouse"

  sp_app_id:
    description: "Application ID of the service principal that runs the pipeline"
    default: "a0cc3696-19fc-4ce7-800c-3ac0f66f7895"

targets:
  dev:
    mode: production
    run_as:
      service_principal_name: ${var.sp_app_id}
    workspace:
      host: https://dbc-0474d945-4a08.cloud.databricks.com
      root_path: ~/.bundle/${bundle.name}/dev
