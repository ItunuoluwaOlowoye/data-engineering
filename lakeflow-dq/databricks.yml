# Databricks Asset Bundle (DAB) config

bundle:
  name: dq-demo

include:
  - resources/pipeline.yml
  - resources/schemas.yml

sync:
  include:
    - databricks.yml
    - resources/**
    - src/**

variables:
  catalog:
    description: "Unity Catalog name"
    default: "workspace"

  volume_files:
    description: "Path to files used for data ingestion"
    default: "/Volumes/workspace/demo/files"

  dab_target_name:
    description: "Name of the target environment to use for DAB operations"
    default: "dev"

targets:
  dev:
    mode: production
    workspace:
      host: https://dbc-0474d945-4a08.cloud.databricks.com
      root_path: ~/.bundle/${bundle.name}/dev
